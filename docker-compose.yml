services:
  px4:
    build:
      context: .
      dockerfile: Dockerfile
    image: px4-autopilot-dev:v1.17.0
    container_name: px4-autopilot
    # The tree is mounted at the SAME absolute path it has on the host
    # (${PWD}, expanded by compose from the shell you run it in). Absolute
    # paths the build writes -- compile_commands.json, the NuttX include
    # symlinks -- are therefore valid on the host too, so host-side
    # IntelliSense works with no path rewriting. Always run compose from the
    # repo root.
    working_dir: ${PWD}

    # Full device access — required to reach host serial/USB devices under
    # /dev for flashing boards, HITL, etc.
    privileged: true

    # Keep an interactive shell available: `docker compose run px4 bash`
    # or `docker compose up -d` then `docker compose exec px4 bash`.
    tty: true
    stdin_open: true

    # SITL / MAVLink UDP ports exposed by the base image.
    ports:
      - "14556:14556/udp"
      - "14557:14557/udp"

    volumes:
      # Host devices (serial ports, USB) for flashing & hardware-in-the-loop.
      - /dev/:/dev/

      # The entire PX4-Autopilot tree, mounted live (read/write) at the
      # host path. Docker creates the mount point inside the container.
      - ./:${PWD}:rw

      # ...except the docker-related files: overlay the host's /dev/null on
      # each so they appear empty inside the container and the live source
      # mount above is not polluted by container-only tooling.
      - /dev/null:${PWD}/Dockerfile:ro
      - /dev/null:${PWD}/docker-compose.yml:ro
      - /dev/null:${PWD}/.dockerignore:ro
